<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Utility — Admin</title>
<style>
  :root{color-scheme:light;--bg:#f7f9fc;--panel:#ffffff;--line:rgba(16,24,40,.11);--ink:#0e1726;
        --muted:#5b6779;--brand:#0b57d0;--ok:#0f7a4d;--bad:#b3261e;--warn:#8a5a00}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Inter,Roboto,system-ui,sans-serif;font-size:14.5px;line-height:1.55}
  .bar{display:flex;align-items:center;gap:14px;padding:13px 22px;
       border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .brand{font-weight:680;letter-spacing:-.02em}
  .tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .sp{flex:1}
  button{font:inherit;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
  .p{background:var(--brand);color:#fff}
  .g{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .d{background:transparent;color:var(--bad);border:1px solid rgba(179,38,30,.35)}
  main{padding:22px;max-width:1240px;margin:0 auto}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
  .tabs button[aria-selected=true]{background:var(--brand);color:#fff}
  .cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card .n{font-size:26px;font-weight:680;letter-spacing:-.02em}
  .card .l{font-size:12.5px;color:var(--muted)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-weight:650;background:#eef2f8;position:sticky;top:0}
  tr:last-child td{border-bottom:0}
  .scroll{max-height:62vh;overflow:auto}
  input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:8px 11px;font:inherit}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--muted)}
  .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;border:1px solid var(--line)}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
  .login{max-width:360px;margin:12vh auto;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:26px}
  .login h1{font-size:19px;margin:0 0 4px} .login p{margin:0 0 18px;color:var(--muted);font-size:13px}
  .login input{width:100%;margin-bottom:12px}
  .msg{margin-top:12px;font-size:13px;min-height:18px}
  .row{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .hide{display:none}
  button:disabled{opacity:.55;cursor:progress}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;
        border-right-color:transparent;border-radius:50%;animation:sp .65s linear infinite;
        vertical-align:-1px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .lockpill{background:rgba(138,90,0,.12);color:var(--warn);border-color:rgba(138,90,0,.3)}
  .grantpill{background:rgba(15,122,77,.12);color:var(--ok);border-color:rgba(15,122,77,.3)}
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;
          gap:9px;z-index:40}
  .toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);
         border-radius:11px;padding:11px 15px;box-shadow:0 10px 30px rgba(16,24,40,.14);
         max-width:370px;animation:tin .22s ease}
  .toast.bad{border-left-color:var(--bad)} .toast.good{border-left-color:var(--ok)}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}}
  .backdrop{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:30;
            display:grid;place-items:center;padding:20px;animation:tin .18s ease}
  .modal{background:var(--panel);border-radius:16px;width:min(680px,100%);
         max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .modal header{padding:16px 20px;border-bottom:1px solid var(--line);
                display:flex;align-items:center;gap:12px}
  .modal header h2{margin:0;font-size:16px}
  .modal .body{padding:6px 0;overflow:auto}
  .note{margin:0;padding:12px 20px;color:var(--muted);font-size:12.5px;
        background:#eef2f8;border-bottom:1px solid var(--line)}
</style>
</head>
<body>

<div id="login" class="login">
  <h1>Utility Admin</h1>
  <p>Operations and monitoring.</p>
  <input id="u" placeholder="Username" autocomplete="username" />
  <input id="p" type="password" placeholder="Password" autocomplete="current-password" />
  <button class="p" style="width:100%" onclick="signIn()">Sign in</button>
  <div class="msg bad" id="lmsg"></div>
</div>

<div id="app" class="hide">
  <div class="bar">
    <span class="brand">Utility Admin</span>
    <span class="tag" id="mail">—</span>
    <span class="sp"></span>
    <button class="g" onclick="loadAll()">Refresh</button>
    <button class="g" onclick="signOut()">Sign out</button>
  </div>
  <main>
    <div class="cards" id="stats"></div>
    <div class="tabs" id="tabs"></div>
    <div class="row" id="filters"></div>
    <div class="panel"><div class="scroll"><table id="tbl"></table></div></div>
  </main>
</div>

<div id="toasts"></div>
<div id="modalHost"></div>

<script>
'use strict';
var API = '/utility-api';
var tab = 'users';
var TABS = [
  ['users','Users'], ['activity','Activity log'], ['errors','Errors'],
  ['feedback','Feedback'], ['backups','Backups']
];

function api(path, options) {
  options = options || {};
  options.credentials = 'same-origin';
  options.headers = Object.assign({'content-type':'application/json'}, options.headers||{});
  return fetch(API + path, options).then(function (r) {
    if (r.status === 401) { showLogin(); throw new Error('Session expired'); }
    return r.json().then(function (d) {
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      return d;
    });
  });
}
function esc(v){ return String(v==null?'':v).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function when(s){ return s ? new Date(s).toLocaleString() : '—'; }
function kb(n){ return n < 1024 ? n+' B' : n < 1048576 ? (n/1024).toFixed(1)+' KB' : (n/1048576).toFixed(1)+' MB'; }

/* Every action reports its outcome. A silent success is indistinguishable from
   a silently failed one, and these actions touch customer data. */
function toast(message, kind){
  var host = document.getElementById('toasts');
  var el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = message;
  host.appendChild(el);
  setTimeout(function(){
    el.style.transition = 'opacity .3s'; el.style.opacity = '0';
    setTimeout(function(){ el.remove(); }, 320);
  }, kind === 'bad' ? 6500 : 3800);
}

/* Runs a promise with the button showing a spinner and locked out of a second
   click, so a slow network cannot be double-submitted. */
function busy(btn, work, doneMessage){
  if (btn.disabled) return Promise.resolve();
  var label = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>' + esc(btn.dataset.busy || 'Working');
  return work()
    .then(function(result){ if (doneMessage) toast(doneMessage, 'good'); return result; })
    .catch(function(e){ toast(e.message || 'That did not work.', 'bad'); throw e; })
    .finally(function(){ btn.disabled = false; btn.innerHTML = label; });
}

function closeModal(){ document.getElementById('modalHost').innerHTML = ''; }

function openModal(title, innerHtml, note){
  document.getElementById('modalHost').innerHTML =
    '<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">'
    + '<header><h2>' + esc(title) + '</h2><span class="sp" style="flex:1"></span>'
    + '<button class="g" onclick="closeModal()">Close</button></header>'
    + (note ? '<p class="note">' + esc(note) + '</p>' : '')
    + '<div class="body" id="modalBody">' + innerHtml + '</div></div></div>';
}

function showLogin(){ document.getElementById('login').classList.remove('hide');
                      document.getElementById('app').classList.add('hide'); }
function showApp(){ document.getElementById('login').classList.add('hide');
                    document.getElementById('app').classList.remove('hide'); loadAll(); }

function signIn(){
  var msg = document.getElementById('lmsg'); msg.textContent = 'Checking…';
  api('/v1/admin/login', {method:'POST', body: JSON.stringify({
    username: document.getElementById('u').value, password: document.getElementById('p').value })})
    .then(function(){ msg.textContent=''; document.getElementById('p').value=''; showApp(); })
    .catch(function(e){ msg.textContent = e.message; });
}
function signOut(){ api('/v1/admin/logout',{method:'POST'}).finally(showLogin); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(function(t){
    return '<button class="g" aria-selected="'+(tab===t[0])+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('');
}
function setTab(t){ tab = t; renderTabs(); loadTable(); }

function loadAll(){
  renderTabs();
  api('/v1/admin/overview').then(function(o){
    var c = o.counts;
    document.getElementById('mail').textContent = o.mailConfigured ? 'Mail configured' : 'Mail not configured';
    document.getElementById('mail').className = 'tag ' + (o.mailConfigured ? 'ok' : 'warn');
    document.getElementById('stats').innerHTML = [
      ['Users', c.accounts], ['Backups', c.backups], ['Stored', kb(o.backupBytes)],
      ['Activity 24h', o.activity24h], ['Errors', c.errors], ['Feedback', c.feedback],
      ['Failed admin logins 7d', o.failedAdminLogins7d]
    ].map(function(s){
      var bad = s[0].indexOf('Failed') === 0 && s[1] > 0;
      return '<div class="card"><div class="n'+(bad?' bad':'')+'">'+esc(s[1])+'</div><div class="l">'+s[0]+'</div></div>';
    }).join('');
  }).catch(function(){});
  loadTable();
}

function loadTable(){
  var f = document.getElementById('filters');
  f.innerHTML = tab === 'users'
    ? '<input id="q" placeholder="Search email or name" oninput="loadTable()" />'
    : (tab === 'activity' ? '<input id="q" placeholder="Filter by action (exact)" oninput="loadTable()" />' : '');
  var q = (document.getElementById('q') || {}).value || '';
  var path = tab === 'users' ? '/v1/admin/users?q=' + encodeURIComponent(q)
           : tab === 'activity' ? '/v1/admin/activity?action=' + encodeURIComponent(q)
           : '/v1/admin/' + tab;
  api(path).then(function(d){ render(d.items || []); }).catch(function(e){
    document.getElementById('tbl').innerHTML = '<tr><td class="bad">'+esc(e.message)+'</td></tr>';
  });
}

function render(items){
  var t = document.getElementById('tbl');
  if (!items.length) { t.innerHTML = '<tr><td style="color:var(--muted)">Nothing to show.</td></tr>'; return; }
  if (tab === 'users') {
    t.innerHTML = '<thead><tr><th>Email</th><th>Name</th><th>Org</th><th>Backups</th>'
      + '<th>Screen lock</th><th>Last sign-in</th><th></th></tr></thead><tbody>'
      + items.map(function(u){
        /* Two independent states. A suspension is ours and takes effect at
           once; a passcode is theirs and can only be released. */
        var lock = '';
        if (u.suspended) {
          lock += '<span class="pill bad" style="border-color:rgba(179,38,30,.35)">Portal locked</span>'
                + '<div class="mono">' + when(u.suspendedAt) + '</div>';
        }
        if (u.unlockGranted) {
          lock += '<div><span class="pill grantpill">Unlock sent</span></div>'
                + '<div class="mono">waiting for their app</div>';
        } else if (u.locked) {
          lock += '<div><span class="pill lockpill">Passcode set</span></div>'
                + '<div class="mono">' + when(u.lockedAt) + '</div>';
        }
        if (u.mustChangePassword) {
          lock += '<div class="mono warn">temporary password — must change</div>';
        }
        if (u.restorePending) {
          lock += '<div class="mono ok">restore queued: ' + esc(u.restorePending) + '</div>';
        }
        if (!lock) lock = '<span class="mono">Open</span>';

        var canUnlock = (u.locked && !u.unlockGranted) || u.suspended;
        var unlock = (u.suspended
            ? ''
            : '<button class="g" data-busy="Locking" onclick="lockUser(this,\''+u.id+'\',\''+esc(u.email)+'\')">Lock</button> ')
          + (canUnlock
            ? '<button class="p" data-busy="Unlocking" onclick="unlockUser(this,\''+u.id+'\',\''+esc(u.email)+'\')">Unlock</button> '
            : '')
          + '<button class="g" data-busy="Resetting" onclick="resetUser(this,\''+u.id+'\',\''+esc(u.email)+'\')">Reset</button> ';
        return '<tr><td>'+esc(u.email)+'<div class="mono">'+esc(u.id)+'</div></td>'
          + '<td><input value="'+esc(u.name)+'" id="n_'+u.id+'" style="width:130px" /></td>'
          + '<td><input value="'+esc(u.org||'')+'" id="o_'+u.id+'" style="width:130px" /></td>'
          + '<td>'+u.backups+'<div class="mono">'+kb(u.backupBytes)+'</div></td>'
          + '<td>'+lock+'</td><td>'+when(u.lastLoginAt)+'</td>'
          + '<td style="white-space:nowrap">' + unlock
          + '<button class="g" data-busy="Loading" onclick="openBackups(this,\''+u.id+'\',\''+esc(u.email)+'\')">Backups</button> '
          + '<button class="g" data-busy="Saving" onclick="saveUser(this,\''+u.id+'\')">Save</button> '
          + '<button class="d" data-busy="Deleting" onclick="delUser(this,\''+u.id+'\',\''+esc(u.email)+'\')">Delete</button></td></tr>';
      }).join('') + '</tbody>';
  } else if (tab === 'activity') {
    t.innerHTML = '<thead><tr><th>When</th><th>Action</th><th>Detail</th><th>Account</th></tr></thead><tbody>'
      + items.map(function(a){
        var bad = a.action.indexOf('failed') !== -1;
        return '<tr><td>'+when(a.at)+'</td><td><span class="pill'+(bad?' bad':'')+'">'+esc(a.action)+'</span></td>'
          + '<td>'+esc(a.detail)+'</td><td class="mono">'+esc(a.accountId||'—')+'</td></tr>';
      }).join('') + '</tbody>';
  } else if (tab === 'errors') {
    t.innerHTML = '<thead><tr><th>When</th><th>Kind</th><th>Message</th><th>Version</th></tr></thead><tbody>'
      + items.map(function(e){
        return '<tr><td>'+when(e.at)+'</td><td class="bad">'+esc(e.kind)+'</td>'
          + '<td>'+esc(e.message)+'</td><td class="mono">'+esc(e.version||'—')+'</td></tr>';
      }).join('') + '</tbody>';
  } else if (tab === 'feedback') {
    t.innerHTML = '<thead><tr><th>When</th><th>Type</th><th>Message</th><th>Reply to</th><th>Version</th></tr></thead><tbody>'
      + items.map(function(f){
        return '<tr><td>'+when(f.at)+'</td><td><span class="pill">'+esc(f.kind)+'</span></td>'
          + '<td>'+esc(f.message)+'</td><td>'+esc(f.email||'—')+'</td><td class="mono">'+esc(f.version||'—')+'</td></tr>';
      }).join('') + '</tbody>';
  } else {
    t.innerHTML = '<thead><tr><th>When</th><th>User</th><th>File</th><th>Size</th><th></th></tr></thead><tbody>'
      + items.map(function(b){
        return '<tr><td>'+when(b.at)+'</td><td>'+esc(b.email||'—')+'</td>'
          + '<td class="mono">'+esc(b.name)+'</td><td>'+kb(b.bytes)+'</td>'
          + '<td style="white-space:nowrap"><button class="g" data-busy="Preparing" '
          + 'onclick="downloadBackup(this,\''+b.accountId+'\',\''+esc(b.name)+'\')">Download</button> '
          + '<button class="p" data-busy="Queuing" onclick="applyBackup(this,\''+b.accountId+'\',\''
          + esc(b.name)+'\',\''+esc(b.email||'this account')+'\')">Apply</button></td></tr>';
      }).join('') + '</tbody>';
  }
}

function saveUser(btn, id){
  busy(btn, function(){
    return api('/v1/admin/users/'+id, {method:'PATCH', body: JSON.stringify({
      name: document.getElementById('n_'+id).value,
      org: document.getElementById('o_'+id).value })});
  }, 'Saved.').then(loadTable, function(){});
}

function delUser(btn, id, email){
  if (!confirm('Delete ' + email + '?\n\nThis removes the account and every backup stored for it. It cannot be undone.')) return;
  busy(btn, function(){ return api('/v1/admin/users/'+id, {method:'DELETE'}); },
       'Deleted ' + email + '.').then(loadAll, function(){});
}

function lockUser(btn, id, email){
  if (!confirm('Lock the portal for ' + email + '?\n\n'
    + 'They will be signed out immediately and cannot use Utility until you unlock it. '
    + 'Their invoices, history and backups are not touched.')) return;
  busy(btn, function(){ return api('/v1/admin/users/'+id+'/lock', {method:'POST'}); },
       'Portal locked. They are signed out now.').then(loadTable, function(){});
}

function unlockUser(btn, id, email){
  if (!confirm('Unlock ' + email + '?\n\n'
    + 'This lifts the portal lock and clears any passcode on their machine, leaving the '
    + 'account passcode-free. They can set a new passcode afterwards if they want one.\n\n'
    + 'The passcode itself is stored on their machine and never sent here, so this does '
    + 'not reveal it — their app clears it the next time it reaches the network.')) return;
  busy(btn, function(){ return api('/v1/admin/users/'+id+'/unlock', {method:'POST'}); },
       'Unlocked. Any passcode clears when their app next connects.')
    .then(loadTable, function(){});
}

function resetUser(btn, id, email){
  if (!confirm('Reset ' + email + '?\n\n'
    + 'Use this when they are locked out completely — passcode forgotten, password '
    + 'forgotten, or both.\n\n'
    + 'It clears every lock, ends all their sessions, and emails them a one-time '
    + 'password they must change when they sign in.\n\n'
    + 'Their invoices, history and backups are NOT deleted.')) return;
  busy(btn, function(){ return api('/v1/admin/users/'+id+'/reset', {method:'POST'}); })
    .then(function(d){
      toast('Reset done. A temporary password was emailed to ' + (d.emailed || email) + '.', 'good');
      loadTable();
    }, function(){});
}

/* Bundles are encrypted on the user's machine with a key the server never
   receives, so this lists and moves sealed blobs. Support can return or replay
   a customer's data without being able to read it. */
function openBackups(btn, id, email){
  busy(btn, function(){ return api('/v1/admin/users/'+id+'/backups'); })
    .then(function(d){ renderBackups(id, email, d.items || []); }, function(){});
}

function renderBackups(id, email, items){
  var rows = !items.length
    ? '<tr><td style="color:var(--muted);padding:16px 20px">No backups stored for this account.</td></tr>'
    : items.map(function(b){
        var actions = b.available
          ? '<button class="g" data-busy="Preparing" onclick="downloadBackup(this,\''+id+'\',\''+esc(b.name)+'\')">Download</button> '
            + '<button class="p" data-busy="Queuing" onclick="applyBackup(this,\''+id+'\',\''+esc(b.name)+'\',\''+esc(email)+'\')">Apply</button>'
          : '<span class="mono bad">no longer on disk</span>';
        return '<tr><td>'+when(b.at)+'<div class="mono">'+esc(b.name)+'</div></td>'
          + '<td>'+kb(b.bytes)+'<div class="mono">'+esc(String(b.sha256).slice(0,16))+'…</div></td>'
          + '<td style="white-space:nowrap">'+actions+'</td></tr>';
      }).join('');
  openModal('Backups — ' + email,
    '<table><thead><tr><th>When</th><th>Size</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>',
    'These bundles are encrypted on the user’s machine. The server cannot read them, '
    + 'so a download gives you a sealed file and Apply asks their app to restore it with '
    + 'their own key on next sync.');
}

function downloadBackup(btn, id, name){
  busy(btn, function(){
    return fetch(API + '/v1/admin/users/'+id+'/backups/'+encodeURIComponent(name),
                 {credentials:'same-origin'})
      .then(function(r){
        if (r.status === 401) { showLogin(); throw new Error('Session expired'); }
        if (!r.ok) throw new Error('That backup is no longer on disk.');
        return r.blob();
      })
      .then(function(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
      });
  }, 'Downloaded ' + name + ' (still encrypted).');
}

function applyBackup(btn, id, name, email){
  if (!confirm('Apply ' + name + ' to ' + email + '?\n\n'
    + 'Their app will restore this bundle the next time it syncs, replacing the data '
    + 'currently on their machine. They keep the only key, so the restore happens there.')) return;
  busy(btn, function(){
    return api('/v1/admin/users/'+id+'/restore',
               {method:'POST', body: JSON.stringify({name: name})});
  }, 'Queued. Their app will restore it on next sync.')
    .then(function(){ closeModal(); loadTable(); }, function(){});
}

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeModal();
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !document.getElementById('login').classList.contains('hide')) signIn();
});
// Probe an authenticated endpoint to decide which view to show on load.
api('/v1/admin/overview').then(showApp).catch(showLogin);
</script>
</body>
</html>
