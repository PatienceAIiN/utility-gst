# modern channel -- Windows 10/11. The default download.
appId: in.patienceai.utility
productName: Utility
copyright: © Patience AI
directories:
  output: ../../release/modern
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  # PyInstaller onedir output. Built on windows-latest in CI -- never under Wine.
  - from: ../../sidecar/dist/gstparse
    to: sidecar
    filter: ["**/*"]
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Utility-Setup-${version}.${ext}
nsis:
  # The same mark on the installer, the uninstaller and the Add/Remove entry --
  # electron-builder does not infer these from win.icon.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Utility
publish:
  # GitHub Releases is the update feed. The repository is public, so clients
  # need no credentials. Each channel uses its own channel file so a Windows 7
  # machine is never offered a modern build.
  provider: github
  owner: PatienceAIiN
  repo: utility-gst
  channel: latest
