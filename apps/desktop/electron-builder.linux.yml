# Fedora / Linux desktop build.
#
# The sidecar here is a native PyInstaller onedir built on this machine -- no
# cross-compilation involved, so this is the one platform where the frozen
# binary is actually exercised locally before shipping.
appId: in.patienceai.utility
productName: Utility
copyright: © Patience AI
directories:
  output: ../../release/linux
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../../sidecar/dist-linux/gstparse
    to: sidecar
    filter: ["**/*"]
linux:
  icon: build/icon.png
  maintainer: Patience AI <support@patienceai.in>
  vendor: Patience AI
  target:
    # AppImage first: it is the only Linux target electron-updater can update
    # in place. rpm and deb are managed by the system package manager instead,
    # which is the right owner of a system-installed package.
    - target: AppImage
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  synopsis: GST invoice digitisation and sales register export
  description: >-
    Offline-first invoice digitisation for Indian GST accounting. Parses
    invoices, validates them arithmetically, and exports a consolidated
    GST Sales Register. No data leaves the machine.
  desktop:
    entry:
      Name: Utility
      Comment: GST invoice digitisation by Patience AI
      Categories: Office;Finance;
deb:
  # The sandbox helper must be setuid root after unpacking or Electron refuses
  # to start. electron-builder does not do this for deb or rpm.
  afterInstall: build/linux-after-install.sh
  afterRemove: build/linux-after-remove.sh
  # Same dependency set as the rpm target; electron-builder does not infer one
  # from the other.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libasound2

rpm:
  afterInstall: build/linux-after-install.sh
  afterRemove: build/linux-after-remove.sh
  # rpmbuild strips and re-links by default, which corrupts the PyInstaller
  # bundle's embedded loader. Leave the payload alone.
  fpm: ["--rpm-tag", "%define _build_id_links none"]

publish:
  provider: github
  owner: PatienceAIiN
  repo: utility-gst
  channel: latest
