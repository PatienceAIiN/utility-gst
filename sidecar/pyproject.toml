[project]
name = "gstparse"
version = "0.1.0"
description = "Offline GST invoice parsing core for Utility by Patience AI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pdfplumber>=0.11.4",
    "openpyxl>=3.1.5",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "mypy>=1.13.0", "ruff>=0.8.0"]

[project.scripts]
gstparse = "gstparse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["gstparse"]
