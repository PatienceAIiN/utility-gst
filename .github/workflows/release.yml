name: Release

# The signed installer is built here, on windows-latest, because PyInstaller
# cannot cross-compile and the brief rightly forbids building the sidecar under
# Wine. Fedora runs the parsing test suite; Windows produces the artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel to build"
        type: choice
        options: [both, modern, legacy]
        default: both

permissions:
  contents: read
  id-token: write   # Workload Identity Federation -- no stored cloud keys

jobs:
  # Parsing correctness is OS-agnostic and gates everything else (brief §11).
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install sidecar
        working-directory: sidecar
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]" types-openpyxl types-python-dateutil
      - name: Lint, typecheck, test
        working-directory: sidecar
        run: |
          .venv/bin/python -m ruff check gstparse
          .venv/bin/python -m mypy gstparse
          .venv/bin/python -m pytest -q

  build-windows:
    needs: test-core
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [modern, legacy]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # pinned to match local dev (DECISIONS.md D-04)

      - name: Build Python sidecar (PyInstaller onedir)
        working-directory: sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
          # run_sidecar.py, not gstparse/cli.py: PyInstaller runs its target as
          # __main__, which breaks every relative import inside the package.
          pyinstaller --noconfirm --onedir --name gstparse `
            --distpath dist --paths . `
            --collect-all pdfplumber --collect-all pdfminer --collect-all openpyxl `
            --collect-all pypdfium2 `
            run_sidecar.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      # The legacy channel is the last Win7-capable Electron. Pinned, not ranged.
      - name: Pin Electron 22 for the legacy channel
        if: matrix.channel == 'legacy'
        working-directory: apps/desktop
        run: npm install --no-save electron@22.3.27

      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build and package
        working-directory: apps/desktop
        env:
          # Build code comes from CI, never hand-edited (brief §8).
          BUILD_CODE: ${{ github.run_number }}
          UPDATE_CHANNEL: ${{ matrix.channel }}
          # Code signing. Until the cert is procured (DECISIONS.md R-03) these
          # are unset and electron-builder produces an unsigned installer.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        # electron-builder downloads the Electron runtime zip from GitHub release
        # assets during packaging, and that download is not retried internally --
        # a dropped connection fails the whole job. Retry the packaging step.
        run: |
          npm run build
          $ErrorActionPreference = 'Continue'
          for ($i = 1; $i -le 3; $i++) {
            # --publish never: the publish config exists so electron-updater
            # metadata (latest.yml / blockmap) is generated, but uploading is the
            # release job's responsibility. Without this, packaging tries to push
            # to GitHub with no token and fails on every retry.
            npx electron-builder --win --publish never --config electron-builder.${{ matrix.channel }}.yml
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::packaging attempt $i failed (exit $LASTEXITCODE); retrying"
            Start-Sleep -Seconds 20
          }
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: utility-${{ matrix.channel }}
          path: |
            release/${{ matrix.channel }}/*.exe
            release/${{ matrix.channel }}/*.blockmap
            release/${{ matrix.channel }}/*.yml
          retention-days: 14


  build-linux:
    needs: test-core
    # 22.04 deliberately, not latest: a binary built against an older glibc runs
    # on newer distributions, but not the other way round. Building on the
    # newest Ubuntu would produce packages that fail to start on anything older.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python sidecar (PyInstaller onedir)
        working-directory: sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
          # run_sidecar.py, not gstparse/cli.py -- PyInstaller runs its target as
          # __main__, which breaks every relative import inside the package.
          pyinstaller --noconfirm --onedir --name gstparse \
            --distpath dist-linux --paths . \
            --collect-all pdfplumber --collect-all pdfminer --collect-all openpyxl \
            --collect-all pypdfium2 \
            run_sidecar.py

      - name: Verify the frozen sidecar actually runs
        working-directory: sidecar
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"ping"}' \
            | ./dist-linux/gstparse/gstparse rpc | grep -q '"ok": true'
          echo "sidecar responds"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      - name: Install packaging tools
        # electron-builder shells out to rpmbuild for the rpm target and needs
        # fakeroot/dpkg for deb.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm fakeroot

      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build and package
        working-directory: apps/desktop
        env:
          BUILD_CODE: ${{ github.run_number }}
          UPDATE_CHANNEL: modern
        run: |
          npm run build
          for i in 1 2 3; do
            npx electron-builder --linux --publish never --config electron-builder.linux.yml && exit 0
            echo "::warning::packaging attempt $i failed; retrying"
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: utility-linux
          path: |
            release/linux/*.AppImage
            release/linux/*.rpm
            release/linux/*.deb
            release/linux/*.yml
            release/linux/*.blockmap
          retention-days: 14

  # Attach the installers to a GitHub Release so there is a direct download URL
  # to open on the target Windows machine -- Actions artifacts require a login
  # and download slowly through the API.
  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Installers only. Every channel emits a file called latest.yml, and a
          # Release cannot hold two assets with the same name -- the second
          # upload 404s. Manifests and blockmaps belong on the R2 update feed
          # (the publish job), not here; this Release is for humans to download.
          # electron-updater fetches the channel manifest and blockmaps from the
          # release, so they must be attached alongside the installers. Each
          # channel emits a DIFFERENTLY named manifest (latest.yml / legacy.yml)
          # because publish.channel is set per config, so there is no collision.
          # builder-debug.yml is electron-builder's own diagnostic output, emitted
          # by every channel under the same name. It is not an update manifest
          # and must not be published.
          mapfile -t ASSETS < <(find dist -type f \
            \( -name '*.exe' -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.deb' \
               -o -name '*.blockmap' -o -name '*.yml' \) \
            ! -name 'builder-debug.yml' | sort)
          printf 'attaching: %s\n' "${ASSETS[@]}"
          [ "${#ASSETS[@]}" -gt 0 ] || { echo "::error::no artifacts found"; exit 1; }

          # Fail loudly on duplicate basenames: a Release cannot hold two assets
          # with the same name and the second upload 404s silently mid-run.
          DUPES=$(basename -a "${ASSETS[@]}" | sort | uniq -d)
          if [ -n "$DUPES" ]; then echo "::error::duplicate asset names: $DUPES"; exit 1; fi

          # Re-running a tag should replace the Release, not fail on conflict.
          gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag=false 2>/dev/null || true

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Utility ${GITHUB_REF_NAME}" \
            --notes "Unsigned build for testing.

          **Windows will warn.** Smart App Control / SmartScreen blocks unsigned software; this is expected until a code-signing certificate is in place. Unblock the file before running — see \`DEPLOYMENT.md\` section 2a.

          - \`Utility-Setup-${GITHUB_REF_NAME#v}.exe\` — Windows 10/11
          - \`Utility-Setup-${GITHUB_REF_NAME#v}-legacy.exe\` — Windows 7 SP1/8/8.1
          - \`Utility-${GITHUB_REF_NAME#v}.AppImage\` — any Linux (updates in place)
          - \`utility-desktop-${GITHUB_REF_NAME#v}.x86_64.rpm\` — Fedora / RHEL
          - \`utility-desktop_${GITHUB_REF_NAME#v}_amd64.deb\` — Ubuntu / Debian" \
            "${ASSETS[@]}"

  publish:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }

      - name: Publish to R2 and prune old releases
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: utility
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          KEEP_RELEASES: "3"
        run: |
          # R2 credentials are optional: until they are configured as repository
          # secrets the release still succeeds, it just is not mirrored to the
          # update feed. Failing here would block a release for a distribution
          # step that is not yet wired.
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${R2_ENDPOINT}" ]; then
            echo "::warning::R2 secrets not configured - skipping update-feed publish"
            exit 0
          fi
          pip install boto3
          for ch in modern legacy; do
            python scripts/r2_publish.py --channel "$ch" --src "dist/utility-$ch"
          done
